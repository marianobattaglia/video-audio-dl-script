services:
  video-audio-dl:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp/downloads:rw,noexec,nosuid,nodev,size=2g,uid=1000,gid=1000
      - /tmp/yt-dlp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=755
    mem_limit: 2g
    cpus: 2.0
    environment:
      PORT: 3000
      MAX_CONCURRENT_DOWNLOADS: 2
      MAX_DOWNLOAD_SECONDS: 3600
      JOB_TTL_SECONDS: 900
      MAX_OUTPUT_MB: 1800
      TMPDIR: /tmp/yt-dlp
